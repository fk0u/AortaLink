name: AortaLink CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build (rsbuild)
        run: npm run build

      - name: Audit Dependencies for Vulnerabilities
        run: npm audit --audit-level=high --production

      - name: Statistical & Cleanup Selfchecks
        run: npm run test:ml && npm run test:cleanup

      - name: HL7 FHIR R4 Bundle Validation
        run: npm run test:fhir

      - name: Research Mode & SaMD Gating Selfcheck
        run: npm run test:research

      - name: Clinical Guidelines & Classification Selfcheck
        run: npm run test:guidelines

      - name: Bluetooth Telemetry & Fallback Protocol Selfcheck
        run: npm run test:ble
