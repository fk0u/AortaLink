version: '3.8'

services:
  aortalink-ehr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aortalink-ehr-platform
    restart: always
    ports:
      - "80:80"
      - "8173:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
